name: build nodejs application on multiple OS
on: # multiple triggers when this workflow can run
 workflow_dispatch:
 push:
   branches:
     - master
 pull_request:
   branches:
     - master
jobs:
  job1:
    continue-on-error: true
    strategy:
      matrix:
        node-version: [12,16,18,20]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Clone the repo
      uses: actions/checkout@v6
    - name: Install nodejs of version ${{ matrix.node-version }} & npm
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install node dependencies
      run: npm ci
    - name: Execute test cases
      run: npm test
    - name: Build the nodejs code
      run: npm run build
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: build-artifact
        path: /home/runner/work/GithubActions-NodeJs-Demo/GithubActions-NodeJs-Demo/dist/index.html   
